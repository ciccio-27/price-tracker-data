name: Check prices

on:
  schedule:
    # once a day. Each run does one search per tracked product, which
    # costs Tavily search quota (1,000 free/month) — see README for the math
    # before making this more frequent.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run price check
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scraper/track.py

      - name: Commit updated data
        run: |
          git config user.name "deal-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/price_history.json data/offers.json data/actions.json
          git diff --quiet --cached || git commit -m "Update prices [skip ci]"
          git push
