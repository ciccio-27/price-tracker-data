name: Check prices

on:
  push:
    paths:
      - "data/products.json"
  schedule:
    # Fixed hourly poll — track.py reads data/schedule.json to decide
    # whether to actually run, so we never need to modify this file.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run price check
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EVENT_NAME: ${{ github.event_name }}
        run: python scraper/track.py

      - name: Update schedule
        run: python scraper/update_schedule.py

      - name: Commit updated data
        run: |
          git config user.name "deal-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/price_history.json data/offers.json data/actions.json data/schedule.json
          git diff --quiet --cached || git commit -m "Update prices [skip ci]"
          git pull --rebase origin master
          git push origin HEAD:master
